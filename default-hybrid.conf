server {
  listen 80;
  server_name localhost;

  # Servir archivos estáticos de React
  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  # Proxy para las llamadas a la API del backend
  location /api {
    # Intentar primero mi-backend (Docker Compose), luego localhost (standalone)
    proxy_pass http://mi-backend:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Si mi-backend no está disponible, redirigir a localhost
    proxy_intercept_errors on;
    error_page 502 503 504 = @fallback;
  }

  # Fallback para cuando mi-backend no está disponible
  location @fallback {
    proxy_pass http://localhost:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Manejo de errores
  error_page   500 502 503 504  /50x.html;
  location = /50x.html {
    root   /usr/share/nginx/html;
  }
} 