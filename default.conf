server {
  listen 80;
  server_name localhost; # O el nombre de dominio que uses

  # Servir archivos estáticos de React
  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html; # Importante para el enrutamiento del lado del cliente de React
  }

  # Proxy para las llamadas a la API del backend
  # Asume que tus llamadas API desde React son como /api/endpoint
  # Esto redirigirá http://localhost:3000/api/endpoint a http://mi-backend:8090/api/endpoint
  location /api {
    # "mi-backend" será el nombre del servicio de tu backend en docker-compose.yml
    # "8090" es el puerto INTERNO en el que escucha tu backend dentro de la red Docker.
    proxy_pass http://mi-backend:8090; # Asegúrate que coincida con el nombre en docker-compose
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Opcional: Reescribir la ruta si tu backend no espera /api
    # Por ejemplo, si tu backend espera /usuarios en lugar de /api/usuarios
    # rewrite /api/(.*) /$1 break;
  }

  # Opcional: Manejo de errores
  error_page   500 502 503 504  /50x.html;
  location = /50x.html {
    root   /usr/share/nginx/html;
  }
}